<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aptis Part 2</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:950px;margin:auto;padding:22px}.card{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:20px;margin-bottom:16px}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #dbe2ea}button{cursor:pointer;font-weight:bold}.primary{background:#2563eb;color:white;border:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.item{display:flex;gap:10px;align-items:center;border:2px solid #dbe2ea;border-radius:11px;padding:12px;margin:9px 0;cursor:grab}.item.dragging{opacity:.4}.num{width:28px;height:28px;border-radius:50%;background:#e8eef7;display:grid;place-items:center;font-weight:bold;flex:none}.fixed{background:#eff6ff;padding:12px;border-radius:10px;margin:12px 0}.hidden{display:none}.good{color:#15803d}.bad{color:#dc2626}.score{font-size:28px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
</style></head><body><div class="wrap">
<div class="card" id="start"><h1>Aptis Reading Part 2</h1><p>Randomized ordering practice using your 13 topics.</p><div class="row"><div class="field"><label>Name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Topics</label><select id="count"><option value="13">All 13</option><option value="10">10</option><option value="5">5</option><option value="1">1</option></select></div><button class="primary" onclick="begin()">Start test</button></div></div>
<div class="card hidden" id="test"><div id="prog"></div><h2 id="title"></h2><p>Drag the five sentences into the correct order.</p><div class="fixed"><b>Sentence 0:</b> <span id="fixed"></span></div><div id="list"></div><button class="primary" id="submit" onclick="check()">Submit</button> <button id="next" class="hidden" onclick="next()">Next →</button><div id="result" class="card hidden"></div></div>
<div class="card hidden" id="done"><h2>Test complete</h2><div id="final" class="score"></div><p id="status"></p><table><thead><tr><th>Topic</th><th>Score</th></tr></thead><tbody id="summary"></tbody></table><br><button class="primary" onclick="location.reload()">New random test</button></div>
</div><script>
const TOPICS=[{"id": 1, "title": "Weekend activities", "fixed": "It started early on Saturday morning with a ten-mile race for adults.", "sentences": ["Sixty men and women ran in this, and Ms Kamur won with a very fast time.", "After receiving the prize, the children's activities and competitions began.", "These activities included football, jumping, and swimming, and they had lots of fun.", "They were all very hungry after all these, so they enjoyed tasty food and drinks with their parents."]}, {"id": 2, "title": "Film", "fixed": "The films in that period were different from the films of today.", "sentences": ["This is because they were black and white, and there was no sound.", "In addition to these technical limitations, film producers also had a very low budget.", "This lack of money mostly affected actors, and they didn't earn much.", "Things have changed over time, and some of them have earned millions of dollars after appearing in films."]}, {"id": 3, "title": "Transportation", "fixed": "In the past, transportation was only available to the rich.", "sentences": ["The invention of cars and trains had changed everything and made travelling cheaper.", "After these two means of transport, travelling becomes even easier with aeroplanes.", "Because flying with them is so fast, more people now go abroad for holiday and work.", "It is more convenient to travel to other part of the world due to the improvement in transports."]}, {"id": 4, "title": "New Café in Town", "fixed": "Last week I went to a new opening cafe on Corner Street.", "sentences": ["It was full of people, and the staff were working hard on their first day.", "Despite the crowd, they found me a nice table and brought me a menu.", "When I first looked at the menu, I was disappointed since I hoped to see a variety of dishes.", "I had to choose one of those, so I decided to choose the most expensive sandwich.", "It was really good with cheese topping, and I would definitely go back to this place."]}, {"id": 5, "title": "Writing about a place", "fixed": "Before starting writing, you need to do research and find out more details about the country.", "sentences": ["It must include data like its people, language, and its culture.", "It may not have enough those information, but still you can find similar ones.", "You can compare these three areas with your own country.", "This comparison can help you find similar understanding between the two nations."]}, {"id": 6, "title": "A famous singer", "fixed": "Michael Jakman is a famous stage singer and performer.", "sentences": ["Before becoming famous at a young age, he studied art and music at high school.", "During this education, he started to perform on stage.", "During his performances on stage, he likes to wear colorful clothes and paint his face.", "This strange ways of dressing and his songs attracted people's attention.", "They started to follow him on social media and he is now very famous."]}, {"id": 7, "title": "Presentation", "fixed": "First, we prepare materials for our group presentation.", "sentences": ["Then, we present our topic for five minutes.", "During the presentation, we use pictures and our own words to explain the ideas.", "After the presentation, the other students ask questions.", "Finally, group members take turns answering the questions."]}, {"id": 8, "title": "Workplace Evolution", "fixed": "In the past, employees followed strict nine-to-five schedules.", "sentences": ["Limited technology once restricted remote work possibilities.", "Modern workplaces are adopting more flexible work models.", "Managers now use software to track project progress remotely.", "Today, companies experiment with shorter workweeks to boost productivity."]}, {"id": 9, "title": "Music festivals", "fixed": "Last Saturday, a live music show was held in town park.", "sentences": ["The local authority planned, sponsored, and paid for everything.", "Because it was free, more than 5,000 people attended.", "Many of them arrived early and visited nearby shops while they were waiting for it to begin.", "The staff there had a busy day, but they were able to close early and watch the famous singer perform.", "He performed for two hours and everyone had great fun."]}, {"id": 10, "title": "End of term project", "fixed": "This semester we have studied several chapters about local history in the class.", "sentences": ["For end of term project, you need to choose at least 2 of these.", "It needs to include relevant images and your own text about the topic.", "Then you need to use images and written text to create a presentation.", "Your presentation offer your key points and you have around 5 minutes to talk.", "After this time, other students are able to ask questions and you need to answer them."]}, {"id": 11, "title": "The first American woman in space", "fixed": "Her father was a skilled worker and her mother was a teacher.", "sentences": ["With the support from parents, Mae went to university to study Science.", "Her degree allows her to get a seat on the training course in the USA.", "This is about space and it helps her to become a member of a research team.", "As a part of this group, she traveled in space and did a lot of experiments there.", "Some of those were about growing plants and some animals in a spaceship."]}, {"id": 12, "title": "Artificial Intelligence", "fixed": "Over the past decade, artificial intelligence has revolutionized various industries.", "sentences": ["The early AI systems were limited to simple pattern recognition tasks.", "High computational costs previously hindered the development of AI.", "Nowadays, AI engineers build advanced models for complex tasks such as language translation.", "Modern AI tools help businesses to analyze data and make better decisions."]}, {"id": 13, "title": "University/College Welcome Day", "fixed": "All students will attend the welcoming day on Monday, the 19th.", "sentences": ["The day will begin at 10 a.m. in the morning with a short presentation.", "At the end of this talk, you will meet the heads of departments and teachers.", "These staff members will give you a guided tour in the buildings and our sport facilities in small groups.", "During this visit, you will need to stay with these students until lunch break.", "This meal will be provided on the second floor of the engineering building."]}];
const APPS_SCRIPT_URL=""; // Organizer: paste Google Apps Script /exec URL here.
let round=[],i=0,cur,correct=0,total=0,name="",rows=[];
const $=x=>document.getElementById(x);
function sh(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function begin(){name=$("name").value.trim();if(!name)return alert("Enter your name.");round=sh(TOPICS).slice(0,+$("count").value);i=0;correct=0;total=0;rows=[];$("start").classList.add("hidden");$("test").classList.remove("hidden");show()}
function show(){cur=round[i];$("prog").textContent=`Topic ${i+1}/${round.length} | Score ${correct}/${total}`;$("title").textContent=cur.id+". "+cur.title;$("fixed").textContent=cur.fixed;$("submit").classList.remove("hidden");$("next").classList.add("hidden");$("result").classList.add("hidden");let list=$("list");list.innerHTML="";sh(cur.sentences).forEach((t,n)=>{let d=document.createElement("div");d.className="item";d.draggable=true;d.dataset.text=t;d.innerHTML=`<span class="num">${n+1}</span><span>${esc(t)}</span>`;d.ondragstart=()=>d.classList.add("dragging");d.ondragend=()=>{d.classList.remove("dragging");nums()};list.appendChild(d)});list.ondragover=e=>{e.preventDefault();let drag=list.querySelector(".dragging");if(!drag)return;let els=[...list.children].filter(x=>x!==drag),after=els.find(x=>e.clientY<x.getBoundingClientRect().top+x.offsetHeight/2);after?list.insertBefore(drag,after):list.appendChild(drag);nums()}}
function nums(){[...$("list").children].forEach((x,n)=>x.querySelector(".num").textContent=n+1)}
function check(){let chosen=[...$("list").children].map(x=>x.dataset.text),ok=0,html="<h3>Result</h3>";chosen.forEach((t,n)=>{let good=t===cur.sentences[n];if(good)ok++;html+=`<div>${good?"✓":"✗"} Position ${n+1}: <b class="${good?"good":"bad"}">${good?"Correct":"Wrong"}</b>${good?"":` — Correct: “${esc(cur.sentences[n])}”`}</div>`});correct+=ok;total+=cur.sentences.length;rows.push({id:cur.id,title:cur.title,score:ok,total:cur.sentences.length});$("prog").textContent=`Topic ${i+1}/${round.length} | Score ${correct}/${total}`;$("result").innerHTML=html+`<p><b>${ok}/${cur.sentences.length}</b></p>`;$("result").classList.remove("hidden");$("submit").classList.add("hidden");$("next").classList.remove("hidden")}
function next(){if(i<round.length-1){i++;show()}else finish()}
function finish(){$("test").classList.add("hidden");$("done").classList.remove("hidden");$("final").textContent=`${correct}/${total} (${Math.round(correct/total*100)}%)`;$("summary").innerHTML=rows.map(r=>`<tr><td>${r.id}. ${esc(r.title)}</td><td>${r.score}/${r.total}</td></tr>`).join("");send()}
function send(){if(!APPS_SCRIPT_URL){$("status").textContent="Result shown locally. Organizer has not connected Google Sheets yet.";return}let f=document.createElement("form");f.method="POST";f.action=APPS_SCRIPT_URL;f.target="saveframe";let data={name,score:correct,total,percent:Math.round(correct/total*100),details:JSON.stringify(rows),timestamp:new Date().toISOString()};for(let k in data){let x=document.createElement("input");x.name=k;x.value=data[k];f.appendChild(x)}document.body.appendChild(f);f.submit();f.remove();$("status").textContent="Result submitted to organizer."}
let fr=document.createElement("iframe");fr.name="saveframe";fr.style.display="none";document.body.appendChild(fr);
</script></body></html>
